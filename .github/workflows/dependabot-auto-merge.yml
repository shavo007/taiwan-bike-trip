name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract dependency info
        id: deps
        run: |
          echo "Extracting dependency information from PR title..."
          
          # Get PR title
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          
          # Check if this is a group update
          if echo "$PR_TITLE" | grep -qi "group"; then
            echo "Detected group update, analyzing actual changes..."
            
            # Get the diff to analyze actual version changes
            git fetch origin ${{ github.event.pull_request.base.ref }}
            git diff origin/${{ github.event.pull_request.base.ref }} -- package.json > /tmp/package_diff.txt
            
            # Extract version changes from package.json
            MAJOR_CHANGES=0
            MINOR_CHANGES=0
            PATCH_CHANGES=0
            
          # Extract all old and new versions and compare them
          OLD_VERSIONS=$(git diff origin/main -- package.json | grep "^-" | grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+")
          NEW_VERSIONS=$(git diff origin/main -- package.json | grep "^+" | grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+")
          
          echo "Old versions found: $OLD_VERSIONS"
          echo "New versions found: $NEW_VERSIONS"
          
          # Convert to arrays
          OLD_ARRAY=($OLD_VERSIONS)
          NEW_ARRAY=($NEW_VERSIONS)
          
          # Compare each pair
          for i in "${!OLD_ARRAY[@]}"; do
            OLD_VERSION="${OLD_ARRAY[i]}"
            NEW_VERSION="${NEW_ARRAY[i]}"
            
            if [[ -n "$OLD_VERSION" && -n "$NEW_VERSION" ]]; then
              echo "Version change: $OLD_VERSION -> $NEW_VERSION"
              
              # Parse version components
              IFS='.' read -r old_major old_minor old_patch <<< "$OLD_VERSION"
              IFS='.' read -r new_major new_minor new_patch <<< "$NEW_VERSION"
              
              # Determine change type
              if [[ $new_major -gt $old_major ]]; then
                MAJOR_CHANGES=$((MAJOR_CHANGES + 1))
                echo "  -> MAJOR change detected"
              elif [[ $new_minor -gt $old_minor ]]; then
                MINOR_CHANGES=$((MINOR_CHANGES + 1))
                echo "  -> MINOR change detected"
              elif [[ $new_patch -gt $old_patch ]]; then
                PATCH_CHANGES=$((PATCH_CHANGES + 1))
                echo "  -> PATCH change detected"
              fi
            fi
          done            echo "Summary: $MAJOR_CHANGES major, $MINOR_CHANGES minor, $PATCH_CHANGES patch changes"
            
            # Determine overall update type
            if [[ $MAJOR_CHANGES -gt 0 ]]; then
              echo "update_type=major_or_unknown" >> $GITHUB_OUTPUT
              echo "safe_update=false" >> $GITHUB_OUTPUT
              echo "Detected major changes in group update"
            elif [[ $MINOR_CHANGES -gt 0 ]]; then
              echo "update_type=minor" >> $GITHUB_OUTPUT
              echo "safe_update=true" >> $GITHUB_OUTPUT
              echo "Detected minor changes in group update"
            elif [[ $PATCH_CHANGES -gt 0 ]]; then
              echo "update_type=patch" >> $GITHUB_OUTPUT
              echo "safe_update=true" >> $GITHUB_OUTPUT
              echo "Detected patch changes in group update"
            else
              echo "update_type=major_or_unknown" >> $GITHUB_OUTPUT
              echo "safe_update=false" >> $GITHUB_OUTPUT
              echo "Could not determine update type for group update"
            fi
          else
            # Individual dependency update - use existing regex logic
            if echo "$PR_TITLE" | grep -qE "(patch|Bumps.*from.*[0-9]+\.[0-9]+\.[0-9]+.*to.*[0-9]+\.[0-9]+\.[0-9]+)"; then
              echo "update_type=patch" >> $GITHUB_OUTPUT
              echo "safe_update=true" >> $GITHUB_OUTPUT
              echo "Detected patch update"
            elif echo "$PR_TITLE" | grep -qE "(minor|Bumps.*from.*[0-9]+\.[0-9]+\..*to.*[0-9]+\.[0-9]+\..*)" && ! echo "$PR_TITLE" | grep -qE "to.*[0-9]+[0-9]\.[0-9]"; then
              echo "update_type=minor" >> $GITHUB_OUTPUT
              echo "safe_update=true" >> $GITHUB_OUTPUT
              echo "Detected minor update"
            else
              echo "update_type=major_or_unknown" >> $GITHUB_OUTPUT
              echo "safe_update=false" >> $GITHUB_OUTPUT
              echo "Detected major or unknown update type"
            fi
          fi

      - name: Check for security updates
        id: security
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_BODY $PR_TITLE" | grep -qi "security\|vulnerability\|CVE"; then
            echo "is_security_update=true" >> $GITHUB_OUTPUT
            echo "Detected security update"
          else
            echo "is_security_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Add appropriate labels
        if: always()
        run: |
          UPDATE_TYPE="${{ steps.deps.outputs.update_type }}"
          IS_SECURITY="${{ steps.security.outputs.is_security_update }}"
          
          LABELS="dependencies"
          
          # Add update type label
          if [ "$UPDATE_TYPE" = "patch" ]; then
            LABELS="$LABELS,dependencies-patch"
          elif [ "$UPDATE_TYPE" = "minor" ]; then
            LABELS="$LABELS,dependencies-minor"
          else
            LABELS="$LABELS,dependencies-major"
          fi
          
          # Add security label if applicable
          if [ "$IS_SECURITY" = "true" ]; then
            LABELS="$LABELS,dependencies-security"
          fi
          
          echo "Adding labels: $LABELS"
          gh pr edit ${{ github.event.pull_request.number }} --add-label "$LABELS"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve safe updates
        if: >
          steps.deps.outputs.safe_update == 'true' && 
          (steps.deps.outputs.update_type == 'patch' || steps.deps.outputs.update_type == 'minor')
        run: |
          echo "Auto-approving ${{ steps.deps.outputs.update_type }} update"
          
          # Approve the PR
          gh pr review ${{ github.event.pull_request.number }} --approve --body "✅ Auto-approved ${{ steps.deps.outputs.update_type }} dependency update"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for safe updates
        if: >
          steps.deps.outputs.safe_update == 'true' && 
          (steps.deps.outputs.update_type == 'patch' || steps.deps.outputs.update_type == 'minor')
        run: |
          echo "Enabling auto-merge for ${{ steps.deps.outputs.update_type }} update"
          
          # Enable auto-merge with squash
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash
          
          echo "✅ Auto-merge enabled. PR will be merged automatically after all checks pass."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on manual review required
        if: steps.deps.outputs.safe_update == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Manual review required for ${{ steps.deps.outputs.update_type }} update"
          
          # Create multiline comment using printf to avoid YAML issues
          COMMENT_MESSAGE=$(printf "🔍 **Dependabot Auto-merge Status**\n\nThis PR contains a **${{ steps.deps.outputs.update_type }}** update, which requires manual review.\n\nOnly **patch** and **minor** updates are automatically merged for security reasons.\n\nPlease review this PR manually and merge when appropriate.")
          
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_MESSAGE"

      - name: Summary
        if: always()
        run: |
          echo "## Dependabot Auto-merge Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Update Type:** ${{ steps.deps.outputs.update_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Safe Update:** ${{ steps.deps.outputs.safe_update }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Update:** ${{ steps.security.outputs.is_security_update }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number:** ${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.deps.outputs.safe_update }}" = "true" ]; then
            echo "- **Action:** Auto-approved and auto-merge enabled ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Action:** Manual review required 👀" >> $GITHUB_STEP_SUMMARY
          fi
