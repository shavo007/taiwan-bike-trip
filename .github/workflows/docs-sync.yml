name: Documentation Sync

on:
  push:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'app/**'
      - 'components/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'next.config.ts'
      - 'tsconfig.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'app/**'
      - 'components/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'next.config.ts'
      - 'tsconfig.json'
  schedule:
    # Run every Sunday at 2 AM UTC to keep documentation fresh
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update all documentation'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run documentation sync
        run: npm run docs:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for documentation changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit documentation updates
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "docs: auto-sync documentation with code changes

          - Updated project structure in README
          - Synchronized workflow descriptions
          - Updated dependency information
          - Validated documentation consistency
          
          Auto-generated by docs-sync workflow"

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true' && github.event_name == 'push'
        run: git push

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-sync documentation with code changes"
          title: "📝 Auto-sync documentation"
          body: |
            ## Automated Documentation Update
            
            This PR contains automated updates to keep documentation in sync with code changes.
            
            ### Changes Made:
            - ✅ Updated project structure in README
            - ✅ Synchronized workflow descriptions  
            - ✅ Updated dependency information
            - ✅ Validated documentation consistency
            
            ### Files Modified:
            - `README.md`
            - `.github/copilot-instructions.md`
            - Other documentation files as needed
            
            ---
            🤖 *This PR was automatically created by the docs-sync workflow*
          branch: docs/auto-sync-${{ github.run_number }}
          delete-branch: true

  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate documentation
        run: npm run docs:validate

      - name: Check for broken links
        run: npm run docs:check-links

      - name: Lint markdown files
        run: npx prettier --check "*.md" ".github/*.md" "**/*.md"